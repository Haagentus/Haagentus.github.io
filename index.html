<body class="lunar-home" id="page-top" data-spy="scroll" data-target=".navbar-fixed-top">

    <div data-layout="navbar"></div>

    <!-- Lunar entrance -->
    <header class="lunar-intro" aria-label="米乎首页">
        <h1 class="sr-only">米乎</h1>
        <div class="lunar-loader" role="progressbar" aria-label="页面加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <svg class="lunar-orbit" viewBox="0 0 320 320" aria-hidden="true">
                <defs>
                    <!-- Preserve the supplied artwork, including its original moon ordering. -->
                    <filter id="lunar-remove-background" color-interpolation-filters="sRGB">
                        <!-- Convert artwork brightness to alpha; dark pixels become transparent. -->
                        <feColorMatrix type="matrix" values="0 0 0 0 .778
                            0 0 0 0 .824
                            0 0 0 0 .982
                            .36 .36 .36 0 -.08" result="transparent-art"/>
                        <feComposite in="transparent-art" in2="SourceGraphic" operator="in"/>
                    </filter>
                    <clipPath id="lunar-art-clip">
                        <path clip-rule="evenodd" d="M 160 20 A 140 140 0 1 1 160 300 A 140 140 0 1 1 160 20 Z M 160 50 A 110 110 0 1 0 160 270 A 110 110 0 1 0 160 50 Z"/>
                        <circle cx="160" cy="160" r="36"/>
                    </clipPath>
                    <mask id="lunar-reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="320" height="320">
                        <path id="lunar-sweep" fill="white" d="M 0 0 H 320 V 320 H 0 Z"/>
                        <circle cx="160" cy="160" r="40" fill="black"/>
                        <circle id="lunar-center-reveal" cx="160" cy="160" r="36" fill="white"/>
                    </mask>
                </defs>
                <g clip-path="url(#lunar-art-clip)" filter="url(#lunar-remove-background)">
                    <image class="lunar-track" href="imgs/lunar-reference.png" x="-338" y="-99" width="1007" height="824"/>
                    <image mask="url(#lunar-reveal)" class="lunar-progress" href="imgs/lunar-reference.png" x="-338" y="-99" width="1007" height="824"/>
                </g>
            </svg>
            <span class="lunar-percentage">0%</span>
        </div>
        <a class="lunar-enter" href="/navigation/">
            <span class="lunar-line" aria-hidden="true"></span>
            <span class="lunar-star" aria-hidden="true">✦</span>
            <span class="lunar-small-star" aria-hidden="true">✦</span>
            <span class="lunar-enter-label">进入</span>
            <span class="lunar-small-star" aria-hidden="true">✦</span>
            <span class="lunar-star" aria-hidden="true">✦</span>
            <span class="lunar-line" aria-hidden="true"></span>
        </a>
    </header>

    <!-- About and Contact Section -->
    <section id="about" class="container content-section text-center">
        <div class="row">
            <div class="col-lg-8 col-lg-offset-2">
                <h2>关于</h2>
                <p>米乎用于整理常用导航、阅读资料、实用工具和资源入口，让访问路径更清晰。</p>
                <p>这里会持续收纳常用页面、轻量工具和文本资料，方便快速到达需要的内容。</p>
                <div id="contact" class="contact-block">
                    <h3>联系</h3>
                    <p>如果你有站点内容、工具或资源入口建议，可以通过邮件联系。</p>
                    <p><a href="mailto:guizhong@agent.qq.com">Haagentus</a></p>
                    <ul class="list-inline banner-social-buttons">
                        <li>
                            <a href="https://github.com/Haagentus/Haagentus.github.io" class="btn btn-default btn-lg"><i class="fa fa-github fa-fw"></i> <span class="network-name">Github</span></a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <!-- Download Section -->

        <div class="download-section">
            <div class="container">
                <div class="col-lg-8 col-lg-offset-2">
                    <h2>阅读与资源</h2>
                    <p>阅读区整理文本资料，下载区提供字体资源归档，也可以先到翻译页查看不同游戏文字的实际效果。</p>
                    <a href="/reading/" class="btn btn-default btn-lg">阅读模块</a>
                    <a href="/translator/" class="btn btn-default btn-lg">文字翻译</a>
                    <a href="/tools/" class="btn btn-default btn-lg">工具集合</a>
                    <a href="/download/" class="btn btn-default btn-lg">资源下载</a>
                </div>
            </div>
